# Generates + checks the site on every push and pull request; optionally deploys site/ to GitHub Pages from main.
# Deploy is OFF until you opt in: Settings → Pages → Source "GitHub Actions", then repo variable DEPLOY_PAGES=true
# (and optionally SITE_URL=https://your-domain). See docs/DEPLOYMENT.md.
name: Check & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate site
        run: node tools/generate.mjs
      - name: Checks (links, anchors, CSP, JSON-LD, SEO, redirects)
        run: node tools/check.mjs

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build (generate with public URL + production checks)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node tools/build.mjs "${SITE_URL:-$PAGES_URL}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
